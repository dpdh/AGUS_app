// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    // Paksa semua modul Android (termasuk capacitor-android dari node_modules)
    // menggunakan Java 17 setelah semua project dievaluasi, sehingga build stabil
    // dan tidak membutuhkan JDK 21 (hindari error invalid source release: 21).
    gradle.projectsEvaluated {
        subprojects { sub ->
            if (sub.plugins.hasPlugin('com.android.application') ||
                sub.plugins.hasPlugin('com.android.library')) {
                sub.android {
                    compileOptions {
                        sourceCompatibility = JavaVersion.VERSION_17
                        targetCompatibility = JavaVersion.VERSION_17
                    }
                }
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
